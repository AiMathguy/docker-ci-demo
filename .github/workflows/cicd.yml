name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt mlflow==2.13.0 optuna==3.6.1 shap==0.45.1 streamlit==1.38.0
      - name: Lint (non-blocking)
        working-directory: Backend
        run: |
          pip install flake8
          flake8 src/main.py src/predict.py --select=E9,F63,F7,F82 --show-source
        continue-on-error: true
      - name: Run tests
        working-directory: Backend
        run: pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/DockerFile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-ci-demo:latest