name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build The Docker Image
        run: docker build ./Backend --file ./Backend/DockerFile --tag workflow-test:$(date +%s)

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt mlflow==2.13.0 optuna==3.6.1 shap==0.45.1 streamlit==1.38.0
      - name: Run tests
        working-directory: Backend
        run: |
          pytest tests/ -v \
            --ignore=tests/test_data_loader.py \
            --ignore=tests/test_final_trainer.py \
            --ignore=tests/test_model_factory.py \
            --ignore=tests/test_smoke_pipeline.py

  build-and-publish:
    needs: [build, build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/DockerFile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-ci-demo:latest